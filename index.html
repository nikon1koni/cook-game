<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fff3e2">
<title>厨房乱斗 · 把摇到的菜做出来</title>
<meta name="description" content="用 64 道家常菜和调理食谱玩的小游戏：摇一道菜，然后备菜、控火候、调味、装盘。">
<style>
  :root{
    --bg:#fff5e6;
    --card:#fffdf8;
    --ink:#2d2016;
    --muted:#8d7662;
    --line:#f0dcc4;
    --brand:#e2542f;
    --brand-deep:#a9341a;
    --gold:#f0a33d;
    --green:#4f7a4a;
    --shadow:0 14px 40px rgba(120,70,30,.12);
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 420px at 10% -10%, #ffe0b8 0%, transparent 60%),
      radial-gradient(700px 380px at 110% 0%, #ffd6c2 0%, transparent 55%),
      var(--bg);
    min-height:100dvh;
    padding:0 16px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:680px;margin:0 auto}

  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:18px 2px 14px;
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px;letter-spacing:.02em}
  .logo .wok{
    width:34px;height:34px;border-radius:12px;background:#ffe3c4;border:1px solid #ffd1a8;
    display:grid;place-items:center;font-size:18px;box-shadow:0 4px 12px rgba(190,110,40,.15);
  }
  .logo small{display:block;font-size:9px;letter-spacing:.22em;color:var(--muted);font-weight:700;margin-top:2px}
  .hud{display:flex;align-items:center;gap:8px}
  .dex{font-size:10px;color:var(--muted);background:#fff0dc;border:1px solid #f3ddc4;border-radius:999px;padding:6px 10px}
  .dex b{color:var(--brand-deep)}
  .sound{
    width:34px;height:34px;border-radius:50%;border:1px solid #f0d8bd;background:#fff8ee;
    color:#a4653b;font-size:14px;cursor:pointer;
  }
  .sound.off{opacity:.45;text-decoration:line-through}

  .screen{display:none;animation:fadeUp .35s ease}
  .screen.active{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- 开始 / 摇菜 ---------- */
  .hero{text-align:center;margin:12px 0 18px}
  .hero h1{margin:0;font-size:clamp(28px,7vw,38px);line-height:1.2;letter-spacing:-.02em}
  .hero h1 em{font-style:normal;color:var(--brand)}
  .hero p{margin:10px auto 0;max-width:30em;color:var(--muted);font-size:13px;line-height:1.7}

  .slotbox{
    border-radius:24px;padding:16px;
    background:radial-gradient(120% 100% at 50% -10%, #6a3b22 0%, #2c1a11 60%, #1d110a 100%);
    box-shadow:0 22px 50px rgba(80,40,15,.28), inset 0 0 0 1px rgba(255,205,140,.16);
  }
  .slothead{display:flex;justify-content:space-between;align-items:center;color:#ffd9a8;font-size:10px;letter-spacing:.2em;padding:0 4px 10px}
  .slothead .badge{border:1px solid rgba(255,217,168,.3);border-radius:999px;padding:4px 8px;background:rgba(255,217,168,.08)}
  .reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .reel{
    background:linear-gradient(180deg,#fffaf0,#ffe9cc);border:2px solid #f1d3a8;border-radius:14px;
    min-height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:10px 6px;text-align:center;box-shadow:inset 0 1px 0 #fff,0 6px 14px rgba(0,0,0,.22);
  }
  .reel .emoji{font-size:26px}
  .reel .name{font-size:12px;font-weight:800;color:#5a3418;line-height:1.3;word-break:break-all}
  .reel.spin .name{filter:blur(.6px);opacity:.7}
  .reel.spin .emoji{animation:jig .16s infinite}
  @keyframes jig{50%{transform:translateY(2px) rotate(4deg)}}

  .btn{
    appearance:none;border:0;border-radius:15px;padding:15px 18px;font-family:inherit;
    font-size:16px;font-weight:900;cursor:pointer;width:100%;letter-spacing:.06em;
    background:linear-gradient(180deg,#ffd27a,#f0a33d);color:#3a1c0c;
    box-shadow:0 6px 0 #a8641c,0 14px 24px rgba(120,70,20,.2);
    transition:transform .08s,box-shadow .08s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a8641c}
  .btn.ghost{
    background:#fff8ee;color:#7a5a3e;border:1px solid #efd8bd;box-shadow:none;
    font-size:13px;padding:12px;font-weight:700;
  }
  .btn.ghost:active{transform:none}
  .rollbtn{margin-top:14px}

  /* ---------- 预览卡 ---------- */
  .preview{
    background:var(--card);border:1px solid var(--line);border-radius:24px;
    padding:22px 18px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;
  }
  .preview::before{
    content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 0%,#fff0d9,transparent 70%);
    pointer-events:none;
  }
  .preview .pe{font-size:64px;line-height:1;position:relative;filter:drop-shadow(0 8px 14px rgba(180,100,30,.18))}
  .preview h2{margin:14px 0 0;font-size:26px;position:relative}
  .preview .tags{justify-content:center;margin-top:10px;position:relative}
  .preview .tip{margin:14px auto 0;max-width:28em;color:var(--muted);font-size:12px;line-height:1.7;position:relative}
  .preview .actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:18px;position:relative}

  .tag{
    display:inline-block;font-size:11px;color:var(--brand-deep);background:#ffe9d8;
    border:1px solid #ffd3b8;border-radius:999px;padding:3px 8px;font-weight:700;margin:2px;
  }

  /* ---------- 做菜 HUD ---------- */
  .cookbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 12px}
  .dots{display:flex;gap:6px}
  .dots i{width:26px;height:5px;border-radius:99px;background:#efdac2;transition:background .2s}
  .dots i.done{background:var(--brand)}
  .dots i.now{background:var(--gold)}
  .score{font-size:11px;color:var(--muted);letter-spacing:.08em}
  .score b{color:var(--brand-deep);font-size:17px;font-variant-numeric:tabular-nums}

  .stagecard{
    background:var(--card);border:1px solid var(--line);border-radius:24px;
    box-shadow:var(--shadow);padding:20px 18px;min-height:330px;position:relative;
  }
  .dishhead{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px dashed #efdbc5;margin-bottom:16px}
  .dishhead .de{font-size:32px;flex:0 0 auto}
  .dishhead h3{margin:0;font-size:18px;line-height:1.25}
  .dishhead p{margin:4px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
  .prompt{font-size:15px;font-weight:900;margin:0 0 5px;line-height:1.4}
  .subprompt{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 14px}

  .chips{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .chipbtn{
    appearance:none;border:1px solid #ecd7bf;background:#fffaf2;border-radius:14px;
    padding:13px 10px;font-family:inherit;font-size:13.5px;font-weight:700;color:#4f3826;
    cursor:pointer;transition:transform .12s,background .12s,border-color .12s;
    display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;
  }
  .chipbtn:active{transform:scale(.97)}
  .chipbtn.picked{background:#e8f4e3;border-color:#b9d8ae;color:#3d6138;opacity:.7;cursor:default}
  .chipbtn.wrong{animation:shakeX .3s;background:#ffe4e0;border-color:#f3b6ab;color:#a93b28}
  @keyframes shakeX{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .pickcount{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px;color:var(--muted)}
  .pickcount b{color:var(--brand-deep)}

  /* 火候 */
  .heat{position:relative;height:44px;border-radius:14px;background:#f6e7d4;border:1px solid #ecd4b8;margin:18px 0 10px;overflow:hidden}
  .heat .zone{
    position:absolute;top:0;bottom:0;background:linear-gradient(180deg,rgba(79,122,74,.25),rgba(79,122,74,.42));
    border-left:2px solid #4f7a4a;border-right:2px solid #4f7a4a;
  }
  .heat .zone::after{content:"PERFECT";position:absolute;left:50%;top:4px;transform:translateX(-50%);font-size:8px;letter-spacing:.12em;color:#3f6239;font-weight:800}
  .heat .needle{
    position:absolute;top:-4px;bottom:-4px;width:4px;border-radius:2px;background:var(--brand);
    box-shadow:0 0 10px rgba(226,84,47,.6);transform:translateX(-50%);left:0;
  }
  .heat.hit{animation:heatHit .3s}
  @keyframes heatHit{50%{background:#e2f0dc}}
  .heatmiss{animation:heatMiss .3s}
  @keyframes heatMiss{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .roundspan{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}

  /* 调味 */
  .season{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .seasonbtn{
    appearance:none;border:1px solid #ecd7bf;background:#fffaf2;border-radius:14px;padding:16px 10px;
    font-family:inherit;font-size:14px;font-weight:800;color:#4f3826;cursor:pointer;
  }
  .seasonbtn.correct{background:#e8f4e3;border-color:#9dcb91;color:#365c31}
  .seasonbtn.wrong{background:#ffe4e0;border-color:#f3b6ab;color:#a93b28}

  /* 装盘 */
  .platewrap{display:flex;flex-direction:column;align-items:center;gap:12px}
  .plate{
    width:170px;height:170px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 50% 45%,#fffdf8 0%,#f2e4d2 62%,#e3cdb2 100%);
    border:6px solid #fffdf8;box-shadow:0 12px 30px rgba(140,90,40,.18),0 0 0 1px #e7d2ba;
  }
  .plate::after{content:"";position:absolute;inset:16px;border-radius:50%;border:1px dashed #e4cdb4}
  .plate .piece{position:absolute;font-size:22px;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
  .timer{font-size:12px;color:var(--muted);letter-spacing:.08em}
  .timer b{color:var(--brand-deep);font-variant-numeric:tabular-nums}
  .tapbig{font-size:18px;padding:16px}

  .feedback{min-height:22px;text-align:center;font-size:12.5px;font-weight:800;color:var(--brand-deep);margin-top:12px}
  .feedback.good{color:#3f6a3a}
  .feedback.bad{color:#b23b28}

  /* 结果 */
  .result{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:26px 20px;text-align:center;position:relative;overflow:hidden}
  .result .glow{position:absolute;inset:-40% -20% auto;height:280px;background:radial-gradient(circle,#ffe7b5,transparent 65%);opacity:.8;pointer-events:none}
  .result .re{font-size:66px;position:relative;line-height:1}
  .stars{font-size:30px;letter-spacing:6px;color:#efb53d;margin-top:8px;position:relative}
  .stars .off{color:#e6d8c5}
  .result h2{margin:10px 0 0;font-size:24px;position:relative}
  .result .rscore{font-size:13px;color:var(--muted);margin-top:6px;position:relative}
  .result .rscore b{color:var(--brand-deep);font-size:20px}
  .result .comment{margin:14px auto 0;max-width:26em;font-size:13px;line-height:1.7;color:#6a523d;position:relative}
  .result .actions{display:grid;gap:9px;margin-top:20px;position:relative}
  .steps-review{text-align:left;margin-top:18px;border-top:1px dashed #efdbc5;padding-top:14px;position:relative}
  .steps-review h4{margin:0 0 8px;font-size:11px;letter-spacing:.16em;color:var(--muted)}
  .steps-review ol{margin:0;padding-left:20px;font-size:12.5px;line-height:1.8;color:#5e4938}
  .steps-review li::marker{color:var(--brand);font-weight:800}
  .newtag{display:inline-block;margin-top:8px;font-size:10px;letter-spacing:.12em;color:#3f6a3a;background:#e8f4e3;border:1px solid #b9d8ae;border-radius:999px;padding:4px 9px;position:relative}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
  .confetti i{position:absolute;width:8px;height:8px;border-radius:2px;will-change:transform,opacity}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#2d2016;color:#fff4e4;font-size:12px;padding:10px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.25s;z-index:90;white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:360px){
    .chips,.season{grid-template-columns:1fr}
    .reel{min-height:86px}
    .reel .name{font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">
      <div class="wok">🍳</div>
      <div>厨房乱斗<small>COOK &amp; CHAOS</small></div>
    </div>
    <div class="hud">
      <div class="dex">图鉴 <b id="dexNum">0</b>/<span id="dexTotal">64</span></div>
      <button class="sound" id="soundBtn" type="button" title="音效">♪</button>
    </div>
  </header>

  <!-- 开始 -->
  <section class="screen active" id="screenSlot">
    <div class="hero">
      <h1>摇一道菜，<br><em>然后把它做出来</em></h1>
      <p>备菜、控火候、调味、装盘。四关都过了，这盘菜才算真正出锅。</p>
    </div>
    <div class="slotbox">
      <div class="slothead"><span>TODAY'S RECIPE</span><span class="badge" id="poolBadge">64 道菜</span></div>
      <div class="reels">
        <div class="reel" id="reel0"><span class="emoji">🥟</span><span class="name">准备中</span></div>
        <div class="reel" id="reel1"><span class="emoji">🍳</span><span class="name">准备中</span></div>
        <div class="reel" id="reel2"><span class="emoji">🍲</span><span class="name">准备中</span></div>
      </div>
    </div>
    <button class="btn rollbtn" id="rollBtn" type="button">🎰 摇一道菜</button>
  </section>

  <!-- 预览 -->
  <section class="screen" id="screenPreview">
    <div class="preview">
      <div class="pe" id="pvEmoji">🍳</div>
      <h2 id="pvName">菜名</h2>
      <div class="tags" id="pvTags"></div>
      <p class="tip" id="pvTip"></p>
      <div class="actions">
        <button class="btn" id="startBtn" type="button">开始做菜</button>
        <button class="btn ghost" id="rerollBtn" type="button">换一道</button>
      </div>
    </div>
  </section>

  <!-- 做菜 -->
  <section class="screen" id="screenCook">
    <div class="cookbar">
      <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
      <div class="score">得分 <b id="scoreNum">0</b></div>
    </div>
    <div class="stagecard">
      <div class="dishhead">
        <div class="de" id="cookEmoji">🍳</div>
        <div>
          <h3 id="cookName">菜名</h3>
          <p id="cookStep">步骤提示</p>
        </div>
      </div>
      <div id="stageArea"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>

  <!-- 结果 -->
  <section class="screen" id="screenResult">
    <div class="result">
      <div class="glow"></div>
      <div class="re" id="resEmoji">🍳</div>
      <div class="stars" id="resStars">★★★</div>
      <h2 id="resName">菜名</h2>
      <div class="rscore">本局得分 <b id="resScore">0</b> / 100</div>
      <p class="comment" id="resComment"></p>
      <div id="newTag"></div>
      <div class="actions">
        <button class="btn" id="againBtn" type="button">再做一道</button>
        <button class="btn ghost" id="mealLink" type="button">去菜谱页看看</button>
      </div>
      <div class="steps-review">
        <h4>这道菜的完整做法</h4>
        <ol id="resSteps"></ol>
      </div>
    </div>
  </section>
</div>

<div class="confetti" id="confetti"></div>
<div class="toast" id="toast"></div>

<script>

ients": ["银耳", "莲子", "桂圆干", "红枣", "冰糖"], "steps": ["银耳泡发撕小朵，莲子泡软。", "银耳加水煮 40 分钟到出胶。", "放莲子、红枣、桂圆再煮 20 分钟。", "加少量冰糖。"], "note": "银耳别隔夜放太久；血糖高的人少放糖。"}, {"name": "桑葚黑芝麻粥", "emoji": "🫐", "tags": ["补血", "润燥", "养发"], "ingredients": ["大米", "桑葚干", "黑芝麻", "红枣", "冰糖少许"], "steps": ["大米洗净，桑葚干冲洗。", "大米加水煮 25 分钟。", "放桑葚、红枣再煮 10 分钟。", "关火撒炒香的黑芝麻。"], "note": "桑葚偏凉，脾胃虚寒、容易腹泻时少吃。"}, {"name": "酒酿蛋", "emoji": "🥚", "tags": ["暖身", "补血", "女生"], "ingredients": ["酒酿", "鸡蛋", "枸杞", "红糖", "水"], "steps": ["水开下酒酿，煮 2 分钟。", "打散鸡蛋，沿锅边淋入。", "放枸杞和少量红糖。", "蛋花浮起就关火。"], "note": "含少量酒精，孕期、哺乳期和对酒精敏感的人不要吃。"}, {"name": "陈皮生姜水", "emoji": "🍵", "tags": ["暖胃", "理气", "简单"], "ingredients": ["陈皮", "生姜", "红糖少许"], "steps": ["陈皮冲洗，生姜切 3 片。", "加水煮 10 分钟。", "关火加一点红糖，温热喝。"], "note": "胃酸多、容易反酸的人别空腹喝；晚上少喝姜。"}, {"name": "白灼菠菜", "emoji": "🥬", "tags": ["补铁", "清淡", "快手"], "ingredients": ["菠菜", "蒜", "生抽", "香油", "盐"], "steps": ["菠菜洗净，根部切开。", "水开加一点盐，先下根再下叶，焯 1 分钟。", "捞出挤干水，切段摆盘。", "淋生抽、香油，撒蒜末。"], "note": "菠菜草酸高，焯水后再吃；肾结石人群控制量。"}, {"name": "山药排骨汤", "emoji": "🍲", "tags": ["健脾", "养胃", "家常"], "ingredients": ["排骨", "铁棍山药", "姜", "枸杞", "盐"], "steps": ["排骨冷水下锅焯水，洗净。", "加姜和热水，小火炖 40 分钟。", "山药去皮切段，下锅再炖 20 分钟。", "加盐和枸杞。"], "note": "山药戴手套削皮；汤面浮油可以撇掉。"}, {"name": "四神汤", "emoji": "🥣", "tags": ["健脾", "祛湿", "温和"], "ingredients": ["茯苓", "莲子", "山药", "芡实", "排骨或瘦肉", "姜"], "steps": ["药材冲洗，莲子去芯。", "排骨焯水。", "全部材料加姜和热水，小火炖 1.5 小时。", "加盐调味。"], "note": "感冒发热时先别喝；孕期或服药中先问医生。"}, {"name": "黑豆核桃粥", "emoji": "🫘", "tags": ["补血", "养发", "补肾"], "ingredients": ["黑豆", "核桃仁", "黑芝麻", "大米", "红枣"], "steps": ["黑豆提前泡 6 小时。", "黑豆和大米加水煮 40 分钟。", "放核桃、红枣再煮 15 分钟。", "关火撒黑芝麻。"], "note": "黑豆不易消化，胃弱的人少量吃；腹泻时少吃。"}, {"name": "鲫鱼豆腐汤", "emoji": "🐟", "tags": ["高蛋白", "清淡", "汤白"], "ingredients": ["鲫鱼", "嫩豆腐", "姜", "葱", "料酒", "盐"], "steps": ["鲫鱼擦干，两面煎到微黄。", "加姜和开水，大火煮 10 分钟至汤白。", "下豆腐块，再煮 5 分钟。", "加盐和葱花。"], "note": "鲫鱼刺多，喝汤时小心；煎鱼前擦干锅不容易破皮。"}, {"name": "清炖鸡汤", "emoji": "🍗", "tags": ["补气", "清淡", "家常"], "ingredients": ["土鸡", "姜", "红枣", "枸杞", "盐"], "steps": ["鸡块冷水下锅焯水。", "加姜片和热水，小火炖 1.5 小时。", "放红枣再炖 20 分钟。", "关火前放枸杞和盐。"], "note": "撇掉表面浮油更清爽；感冒发热时不要喝太补的汤。"}, {"name": "红枣蒸南瓜", "emoji": "🎃", "tags": ["健脾", "补血", "甜口"], "ingredients": ["南瓜", "红枣", "枸杞"], "steps": ["南瓜去皮切厚片，摆盘。", "红枣去核切条，铺在南瓜上。", "水开蒸 15 分钟。", "出锅撒枸杞。"], "note": "南瓜本身甜，控糖的人控制份量；红枣别放太多。"}];
</script>
<script>
(function () {
  "use strict";

  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var screen = {
    slot: $("#screenSlot"),
    preview: $("#screenPreview"),
    cook: $("#screenCook"),
    result: $("#screenResult")
  };

  function show(name) {
    Object.keys(screen).forEach(function (k) { screen[k].classList.toggle("active", k === name); });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ---------- 存档 ----------
  var SAVE_KEY = "cook_chaos_v1";
  var save = { cooked: [], best: {}, sound: true };
  try {
    var raw = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
    if (Array.isArray(raw.cooked)) save.cooked = raw.cooked;
    if (raw.best && typeof raw.best === "object") save.best = raw.best;
    if (raw.sound === false) save.sound = false;
  } catch (e) {}
  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  }
  function updateDex() {
    $("#dexNum").textContent = save.cooked.length;
    $("#dexTotal").textContent = RECIPES.length;
    $("#poolBadge").textContent = RECIPES.length + " 道菜";
  }

  // ---------- 音效 ----------
  var actx = null;
  function audio() {
    if (!save.sound) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function tone(freq, dur, type, vol, delay) {
    var a = audio();
    if (!a) return;
    var t = a.currentTime + (delay || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.035, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sfxTap() { tone(660, 0.05, "square", 0.02); }
  function sfxGood() { tone(784, 0.08, "triangle", 0.03); tone(1046, 0.1, "sine", 0.025, 0.05); }
  function sfxBad() { tone(200, 0.12, "sawtooth", 0.025); }
  function sfxWin() { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, 0.16, "triangle", 0.035, i * 0.09); }); }

  var soundBtn = $("#soundBtn");
  soundBtn.classList.toggle("off", !save.sound);
  soundBtn.addEventListener("click", function () {
    save.sound = !save.sound;
    soundBtn.classList.toggle("off", !save.sound);
    persist();
    if (save.sound) sfxTap();
  });

  // ---------- 通用 ----------
  var state = {
    dish: null,
    stage: 0,
    score: 0,
    stageScore: [0, 0, 0, 0],
    spinning: false,
    timers: [],
    intervals: []
  };
  function clearTimers() {
    state.timers.forEach(clearTimeout);
    state.timers = [];
    state.intervals.forEach(clearInterval);
    state.intervals = [];
  }
  function later(fn, ms) { var t = setTimeout(fn, ms); state.timers.push(t); return t; }
  function every(fn, ms) { var t = setInterval(fn, ms); state.intervals.push(t); return t; }
  function feedback(text, type) {
    var el = $("#feedback");
    el.textContent = text || "";
    el.className = "feedback" + (type ? " " + type : "");
  }
  function toast(text) {
    var el = $("#toast");
    el.textContent = text;
    el.classList.add("on");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("on"); }, 1600);
  }
  function addScore(n) {
    state.score = Math.max(0, Math.min(100, state.score + n));
    $("#scoreNum").textContent = state.score;
  }
  function updateDots() {
    $$("#dots i").forEach(function (el, i) {
      el.className = i < state.stage ? "done" : i === state.stage ? "now" : "";
    });
  }
  function setDishHead() {
    $("#cookEmoji").textContent = state.dish.emoji;
    $("#cookName").textContent = state.dish.name;
    var step = state.dish.steps[Math.min(state.stage, state.dish.steps.length - 1)] || "";
    $("#cookStep").textContent = step;
  }

  // ---------- 摇菜 ----------
  var reels = [$("#reel0"), $("#reel1"), $("#reel2")];
  function renderReel(el, dish, spinning) {
    el.innerHTML = '<span class="emoji">' + dish.emoji + '</span><span class="name">' + dish.name + '</span>';
    el.classList.toggle("spin", !!spinning);
  }
  function randomDish(except) {
    var d = RECIPES[Math.floor(Math.random() * RECIPES.length)];
    if (except && RECIPES.length > 1) {
      var guard = 0;
      while (d.name === except && guard++ < 20) d = RECIPES[Math.floor(Math.random() * RECIPES.length)];
    }
    return d;
  }

  var rollTimer = 0;
  function roll() {
    if (state.spinning) return;
    state.spinning = true;
    clearTimers();
    $("#rollBtn").disabled = true;
    var chosen = randomDish(state.dish && state.dish.name);
    reels.forEach(function (el) { el.classList.add("spin"); });
    var tick = every(function () {
      reels.forEach(function (el) { renderReel(el, randomDish(), true); });
    }, 80);
    later(function () { clearInterval(tick); }, 1250);
    [0, 1, 2].forEach(function (i) {
      later(function () {
        renderReel(reels[i], chosen, false);
        sfxTap();
        if (i === 2) {
          state.dish = chosen;
          state.spinning = false;
          $("#rollBtn").disabled = false;
          openPreview(chosen);
        }
      }, 1100 + i * 200);
    });
  }

  function openPreview(dish) {
    $("#pvEmoji").textContent = dish.emoji;
    $("#pvName").textContent = dish.name;
    $("#pvTags").innerHTML = dish.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join("");
    $("#pvTip").textContent = dish.why || dish.steps[0] || "";
    show("preview");
  }

  // ---------- 开始 ----------
  function startCooking() {
    clearTimers();
    state.stage = 0;
    state.score = 0;
    state.stageScore = [0, 0, 0, 0];
    $("#scoreNum").textContent = "0";
    updateDots();
    show("cook");
    startStage1();
  }

  // ---------- 阶段 1：备菜 ----------
  function startStage1() {
    state.stage = 0;
    updateDots();
    setDishHead();
    feedback("");
    var dish = state.dish;
    var correct = dish.ingredients.slice(0, Math.min(4, dish.ingredients.length));
    var pool = [];
    RECIPES.forEach(function (d) { d.ingredients.forEach(function (x) { if (pool.indexOf(x) < 0) pool.push(x); }); });
    var others = pool.filter(function (x) { return correct.indexOf(x) < 0; });
    var distractors = [];
    while (distractors.length < Math.max(4, 8 - correct.length) && others.length) {
      var pick = others[Math.floor(Math.random() * others.length)];
      distractors.push(pick);
      others.splice(others.indexOf(pick), 1);
    }
    var all = correct.map(function (x) { return { name: x, ok: true }; })
      .concat(distractors.map(function (x) { return { name: x, ok: false }; }));
    all.sort(function () { return Math.random() - 0.5; });

    var stage1Score = 30;
    var picked = 0;
    var html = '<p class="prompt">备菜：选出这道菜需要的食材</p>' +
      '<p class="subprompt">提示：' + (dish.steps[0] || "把食材准备好") + '</p>' +
      '<div class="chips" id="ingChips">' +
      all.map(function (x, i) { return '<button class="chipbtn" type="button" data-i="' + i + '" data-ok="' + x.ok + '">' + x.name + '</button>'; }).join("") +
      '</div><div class="pickcount"><span>已选 <b id="pickNum">0</b> / ' + correct.length + '</span><span>选错 -5 分</span></div>';
    $("#stageArea").innerHTML = html;

    $$("#ingChips .chipbtn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.classList.contains("picked") || btn.disabled) return;
        if (btn.getAttribute("data-ok") === "true") {
          btn.classList.add("picked");
          btn.disabled = true;
          picked++;
          sfxTap();
          $("#pickNum").textContent = picked;
          if (picked === correct.length) {
            state.stageScore[0] = Math.max(0, stage1Score);
            addScore(state.stageScore[0]);
            feedback("备菜完成！", "good");
            later(function () { startStage2(); }, 700);
          }
        } else {
          btn.classList.add("wrong");
          stage1Score -= 5;
          sfxBad();
          feedback("拿错了，这道菜不需要它 -5", "bad");
          later(function () { btn.classList.remove("wrong"); }, 320);
        }
      });
    });
  }

  // ---------- 阶段 2：火候 ----------
  function startStage2() {
    state.stage = 1;
    updateDots();
    setDishHead();
    feedback("");
    var rounds = 3;
    var round = 1;
    var pos = 0, dir = 1, speed = 58, zoneStart = 42, zoneWidth = 18;
    var running = true;
    var raf = null;
    var last = 0;

    $("#stageArea").innerHTML =
      '<p class="prompt">火候：指针进绿区时点「下锅」</p>' +
      '<p class="subprompt">' + (state.dish.steps[1] || "火候很关键，别糊了") + '</p>' +
      '<div class="roundspan"><span>第 <b id="heatRound">1</b> / 3 锅</span><span>完美 10 分 · 偏一点 5 分</span></div>' +
      '<div class="heat" id="heatBar"><div class="zone" id="heatZone"></div><div class="needle" id="needle"></div></div>' +
      '<button class="btn tapbig" id="wokBtn" type="button">下锅！</button>';

    var bar = $("#heatBar");
    var zone = $("#heatZone");
    var needle = $("#needle");
    var roundEl = $("#heatRound");

    function layoutZone() {
      zoneStart = 18 + Math.random() * 58;
      zoneWidth = Math.max(12, 20 - (round - 1) * 3);
      zone.style.left = zoneStart + "%";
      zone.style.width = zoneWidth + "%";
    }
    layoutZone();

    function tick(t) {
      if (!running) return;
      if (!last) last = t;
      var dt = Math.min(50, t - last) / 1000;
      last = t;
      pos += dir * speed * dt;
      if (pos >= 100) { pos = 100; dir = -1; }
      if (pos <= 0) { pos = 0; dir = 1; }
      needle.style.left = pos + "%";
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    function finishRound(points) {
      state.stageScore[1] += points;
      addScore(points);
      if (round >= rounds) {
        running = false;
        cancelAnimationFrame(raf);
        feedback("火候掌握得不错！", "good");
        later(function () { startStage3(); }, 750);
        return;
      }
      round++;
      roundEl.textContent = round;
      speed += 18;
      layoutZone();
      pos = 0;
      dir = 1;
      feedback(points === 10 ? "完美火候 +10" : points === 5 ? "稍微偏了一点 +5" : "糊了一下 +0", points ? "good" : "bad");
    }

    $("#wokBtn").addEventListener("click", function () {
      if (!running) return;
      var inZone = pos >= zoneStart && pos <= zoneStart + zoneWidth;
      var near = pos >= zoneStart - 9 && pos <= zoneStart + zoneWidth + 9;
      var points = inZone ? 10 : near ? 5 : 0;
      bar.classList.remove("hit", "heatmiss");
      void bar.offsetWidth;
      bar.classList.add(points ? "hit" : "heatmiss");
      if (points) sfxGood(); else sfxBad();
      finishRound(points);
    });
  }

  // ---------- 阶段 3：调味 ----------
  function startStage3() {
    state.stage = 2;
    updateDots();
    setDishHead();
    feedback("");
    var dish = state.dish;
    var seasonings = ["盐", "生抽", "老抽", "醋", "糖", "冰糖", "红糖", "豆瓣酱", "蚝油", "料酒", "香油", "姜", "蒜", "葱", "花椒", "干辣椒", "胡椒", "番茄膏", "蒸鱼豉油", "黄灯笼椒酱", "芝麻酱", "咖喱"];
    var correct = null;
    dish.ingredients.some(function (x) {
      return seasonings.some(function (s) { return x.indexOf(s) >= 0; }) && (correct = x);
    });
    if (!correct) correct = dish.ingredients[Math.floor(Math.random() * dish.ingredients.length)];

    var pool = [];
    RECIPES.forEach(function (d) { d.ingredients.forEach(function (x) { if (pool.indexOf(x) < 0) pool.push(x); }); });
    var others = pool.filter(function (x) { return x !== correct; });
    var opts = [correct];
    while (opts.length < 4 && others.length) {
      var p = others[Math.floor(Math.random() * others.length)];
      opts.push(p);
      others.splice(others.indexOf(p), 1);
    }
    opts.sort(function () { return Math.random() - 0.5; });

    $("#stageArea").innerHTML =
      '<p class="prompt">调味：这道菜需要哪一样？</p>' +
      '<p class="subprompt">' + (dish.steps[2] || "按菜谱调味，别手抖") + '</p>' +
      '<div class="season" id="seasonBox">' +
      opts.map(function (x) { return '<button class="seasonbtn" type="button" data-x="' + x + '">' + x + '</button>'; }).join("") +
      '</div>';

    var answered = false;
    $$("#seasonBox .seasonbtn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (answered) return;
        answered = true;
        var ok = btn.getAttribute("data-x") === correct;
        btn.classList.add(ok ? "correct" : "wrong");
        if (!ok) {
          $$("#seasonBox .seasonbtn").forEach(function (b) {
            if (b.getAttribute("data-x") === correct) b.classList.add("correct");
          });
          sfxBad();
          feedback("调味不对，正确答案是「" + correct + "」", "bad");
        } else {
          state.stageScore[2] = 20;
          addScore(20);
          sfxGood();
          feedback("调味正确 +20", "good");
        }
        later(function () { startStage4(); }, 900);
      });
    });
  }

  // ---------- 阶段 4：装盘 ----------
  function startStage4() {
    state.stage = 3;
    updateDots();
    setDishHead();
    feedback("");
    var need = 12;
    var done = 0;
    var timeLeft = 4.0;
    var used = 0;
    var finished = false;

    $("#stageArea").innerHTML =
      '<p class="prompt">装盘：快速点击 ' + need + ' 下，把菜装进盘子</p>' +
      '<p class="subprompt">' + (state.dish.steps[3] || "最后一步，摆盘要好看") + '</p>' +
      '<div class="platewrap"><div class="plate" id="plate"></div>' +
      '<div class="timer">剩余时间 <b id="timeLeft">4.0</b>s</div>' +
      '<button class="btn tapbig" id="plateBtn" type="button">装盘 +1</button></div>';

    var plate = $("#plate");
    var timerEl = $("#timeLeft");

    function place() {
      var el = document.createElement("div");
      el.className = "piece";
      var ang = Math.random() * Math.PI * 2;
      var rad = 12 + Math.random() * 52;
      el.style.left = (50 + Math.cos(ang) * rad) + "%";
      el.style.top = (50 + Math.sin(ang) * rad) + "%";
      el.textContent = state.dish.emoji;
      plate.appendChild(el);
    }

    function finish(score, msg) {
      if (finished) return;
      finished = true;
      clearInterval(timer);
      state.stageScore[3] = score;
      addScore(score);
      feedback(msg, score > 0 ? "good" : "bad");
      later(function () { showResult(); }, 850);
    }

    var timer = every(function () {
      timeLeft = Math.max(0, timeLeft - 0.1);
      timerEl.textContent = timeLeft.toFixed(1);
      if (timeLeft <= 0) finish(done >= need ? 15 : Math.round(done / need * 8), done >= need ? "赶在最后一刻装好了" : "手慢了，菜凉了一点");
    }, 100);

    $("#plateBtn").addEventListener("click", function () {
      if (finished) return;
      done++;
      place();
      sfxTap();
      if (done >= need) {
        var bonus = timeLeft >= 2.5 ? 20 : timeLeft >= 1.5 ? 17 : 14;
        finish(bonus, "装盘完成！");
      }
    });
  }

  // ---------- 结果 ----------
  function showResult() {
    clearTimers();
    state.stage = 4;
    updateDots();
    var score = state.score;
    var stars = score >= 85 ? 3 : score >= 65 ? 2 : 1;
    $("#resEmoji").textContent = state.dish.emoji;
    $("#resName").textContent = state.dish.name;
    $("#resScore").textContent = score;
    $("#resStars").innerHTML = new Array(3).fill(0).map(function (_, i) {
      return '<span class="' + (i < stars ? "" : "off") + '">★</span>';
    }).join("");
    var comments = {
      3: "完美出锅！这盘可以端给客人了。",
      2: "味道不错，火候再稳一点就更好了。",
      1: "能吃，但下次别一边做一边刷手机。"
    };
    $("#resComment").textContent = comments[stars];
    $("#resSteps").innerHTML = state.dish.steps.map(function (s) { return "<li>" + s + "</li>"; }).join("");

    var isNew = save.cooked.indexOf(state.dish.name) < 0;
    if (isNew) save.cooked.push(state.dish.name);
    if (!save.best[state.dish.name] || score > save.best[state.dish.name]) save.best[state.dish.name] = score;
    persist();
    updateDex();
    $("#newTag").innerHTML = isNew ? '<span class="newtag">NEW · 图鉴 +1</span>' : "";

    show("result");
    if (score >= 85) {
      sfxWin();
      confetti();
    } else {
      sfxGood();
    }
  }

  function confetti() {
    var box = $("#confetti");
    var colors = ["#e2542f", "#f0a33d", "#4f7a4a", "#8b5cf6", "#ffcf5c"];
    for (var i = 0; i < 42; i++) {
      (function (i) {
        setTimeout(function () {
          var el = document.createElement("i");
          el.style.left = Math.random() * 100 + "vw";
          el.style.top = "-10px";
          el.style.background = colors[i % colors.length];
          el.style.width = (6 + Math.random() * 6) + "px";
          el.style.height = (8 + Math.random() * 8) + "px";
          box.appendChild(el);
          var dur = 1600 + Math.random() * 900;
          var drift = (Math.random() - 0.5) * 240;
          el.animate([
            { transform: "translate3d(0,0,0) rotate(0deg)", opacity: 1 },
            { transform: "translate3d(" + drift + "px, 105vh, 0) rotate(" + (360 + Math.random() * 540) + "deg)", opacity: .9 }
          ], { duration: dur, easing: "cubic-bezier(.2,.6,.4,1)", fill: "forwards" }).onfinish = function () { el.remove(); };
        }, i * 18);
      })(i);
    }
  }

  // ---------- 事件 ----------
  $("#rollBtn").addEventListener("click", roll);
  $("#startBtn").addEventListener("click", startCooking);
  $("#rerollBtn").addEventListener("click", function () { show("slot"); later(roll, 150); });
  $("#againBtn").addEventListener("click", function () {
    show("slot");
    state.dish = null;
    later(roll, 250);
  });
  $("#mealLink").addEventListener("click", function () {
    window.location.href = "https://nikon1koni.github.io/meal-slot/";
  });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") {
      var active = document.activeElement;
      if (active && active.tagName === "BUTTON") return;
      if (screen.slot.classList.contains("active")) { e.preventDefault(); roll(); }
    }
  });

  // ---------- 初始化 ----------
  updateDex();
  reels.forEach(function (el, i) {
    renderReel(el, RECIPES[(i * 7 + 3) % RECIPES.length], false);
  });
})();
</script>
</body>
